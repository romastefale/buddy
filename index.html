<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardiões Virtuais - Material Design</title>
    <!-- Tipografia PT Serif e Ícones Oficiais do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <meta name="theme-color" id="themeColorMeta" content="#FBF8F5">
    
    <style>
        :root {
            /* Palette Material Design 3 - Modo Claro (Off-white & Slate Brown) */
            --md-sys-color-background: #FBF8F5;
            --md-sys-color-on-background: #201A17;
            --md-sys-color-surface: #F5EFEA;
            --md-sys-color-surface-container: #FFFFFF;
            --md-sys-color-surface-variant: #ECE0D8;
            --md-sys-color-on-surface: #201A17;
            --md-sys-color-on-surface-variant: #40342C;
            
            --md-sys-color-primary: #785335;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #FFDCC3;
            --md-sys-color-on-primary-container: #2C1600;
            
            --md-sys-color-secondary: #6F5B4D;
            --md-sys-color-secondary-container: #FAF0E6;
            --md-sys-color-on-secondary-container: #28180E;
            
            --md-sys-color-outline: #857468;
            --md-sys-color-outline-variant: #D7C3B5;
            
            /* Hairline Border & Enhanced Glow Tokens */
            --md-sys-color-hairline: rgba(133, 116, 104, 0.14);
            --md-sys-color-glow: rgba(120, 83, 53, 0.08);
            --md-sys-color-glow-intense: rgba(120, 83, 53, 0.16);
            
            /* Status Indicators */
            --md-sys-color-good: #386A20;
            --md-sys-color-good-container: #B7F397;
            --md-sys-color-warning: #7D5260;
            --md-sys-color-warning-container: #FFD9E3;
            --md-sys-color-error: #BA1A1A;
            --md-sys-color-error-container: #FFDAD6;

            /* Elevation Tokens M3 - Calibrados para profundidade suave */
            --md-elevation-1: 0px 2px 8px -1px rgba(60, 40, 20, 0.08), 0px 1px 3px rgba(0, 0, 0, 0.04);
            --md-elevation-2: 0px 6px 18px -2px rgba(120, 83, 53, 0.12), 0px 2px 6px rgba(0, 0, 0, 0.06);
            --md-elevation-3: 0px 12px 28px -4px rgba(120, 83, 53, 0.18), 0px 4px 12px rgba(0, 0, 0, 0.08);
            
            --md-shape-corner-small: 10px;
            --md-shape-corner-medium: 18px;
            --md-shape-corner-large: 26px;
            --md-shape-corner-full: 9999px;

            transition: background-color 0.3s ease, color 0.3s ease;
        }

        [data-theme="dark"] {
            /* Palette Material Design 3 - Modo Escuro (Slate Brown & Warm Dark) */
            --md-sys-color-background: #18120E;
            --md-sys-color-on-background: #ECE0D8;
            --md-sys-color-surface: #241C17;
            --md-sys-color-surface-container: #2E251F;
            --md-sys-color-surface-variant: #3A3029;
            --md-sys-color-on-surface: #ECE0D8;
            --md-sys-color-on-surface-variant: #E2D3C7;
            
            --md-sys-color-primary: #E9B998;
            --md-sys-color-on-primary: #44260D;
            --md-sys-color-primary-container: #5E3C20;
            --md-sys-color-on-primary-container: #FFDCC3;
            
            --md-sys-color-secondary: #DBC2B0;
            --md-sys-color-secondary-container: #3B3128;
            --md-sys-color-on-secondary-container: #FAF0E6;
            
            --md-sys-color-outline: #A08D81;
            --md-sys-color-outline-variant: #52443C;
            
            /* Hairline Border & Ambient Glow no modo escuro */
            --md-sys-color-hairline: rgba(236, 224, 216, 0.12);
            --md-sys-color-glow: rgba(233, 185, 152, 0.10);
            --md-sys-color-glow-intense: rgba(233, 185, 152, 0.22);

            --md-sys-color-good: #9CD67D;
            --md-sys-color-good-container: #21510B;
            --md-sys-color-warning: #EFB8C8;
            --md-sys-color-warning-container: #633B48;
            --md-sys-color-error: #FFB4AB;
            --md-sys-color-error-container: #93000A;

            --md-elevation-1: 0px 3px 12px 0px rgba(0, 0, 0, 0.40);
            --md-elevation-2: 0px 8px 22px 0px rgba(0, 0, 0, 0.55), 0px 0px 14px 1px rgba(233, 185, 152, 0.10);
            --md-elevation-3: 0px 14px 32px 0px rgba(0, 0, 0, 0.70), 0px 0px 20px 2px rgba(233, 185, 152, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PT Serif', serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            max-height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            font-size: 16px;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 2vh, 18px) clamp(12px, 3vw, 24px);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            user-select: none;
        }

        header {
            width: 100%;
            max-width: 620px;
            height: clamp(40px, 6vh, 52px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            flex-shrink: 0;
            margin-bottom: clamp(4px, 1vh, 8px);
        }

        .app-bar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(1.3rem, 2.8vh, 1.6rem);
            font-weight: 700;
            color: var(--md-sys-color-on-background);
            letter-spacing: -0.01em;
        }

        .icon-btn {
            background: var(--md-sys-color-surface);
            border: 0.5px solid var(--md-sys-color-hairline);
            color: var(--md-sys-color-on-surface-variant);
            width: clamp(40px, 5.5vh, 48px);
            height: clamp(40px, 5.5vh, 48px);
            border-radius: var(--md-shape-corner-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--md-elevation-1);
            transition: all 0.2s cubic-bezier(0.2, 0.0, 0.0, 1.0);
        }

        .icon-btn:hover {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-primary);
            box-shadow: var(--md-elevation-2);
            transform: translateY(-1px);
        }

        .container {
            width: 100%;
            max-width: 620px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--md-sys-color-surface-container);
            border-radius: var(--md-shape-corner-large);
            padding: clamp(14px, 2.4vh, 22px);
            box-shadow: var(--md-elevation-2);
            border: 0.5px solid var(--md-sys-color-hairline);
            overflow: hidden;
            justify-content: space-between;
        }

        .screen {
            display: none;
            height: 100%;
            width: 100%;
            min-height: 0;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            animation: m3FadeIn 0.28s cubic-bezier(0.2, 0.0, 0.0, 1.0);
            gap: clamp(8px, 1.5vh, 14px);
        }

        .screen.active {
            display: flex;
        }

        @keyframes m3FadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        .headline-medium {
            font-size: clamp(1.2rem, 2.6vh, 1.5rem);
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            line-height: 1.25;
            margin-bottom: 2px;
        }

        .body-medium {
            font-size: clamp(0.88rem, 1.9vh, 1.02rem);
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: clamp(4px, 1vh, 8px);
            line-height: 1.35;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: clamp(8px, 1.4vh, 12px);
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 2px;
        }

        @media (max-width: 480px) {
            .character-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(5, 1fr);
            }
        }

        .char-card {
            background-color: var(--md-sys-color-surface);
            border: 0.5px solid var(--md-sys-color-hairline);
            border-radius: var(--md-shape-corner-medium);
            padding: clamp(6px, 1vh, 10px) 6px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--md-elevation-1);
            transition: all 0.2s cubic-bezier(0.2, 0.0, 0.0, 1.0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .char-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--md-elevation-2);
            border-color: var(--md-sys-color-primary);
            background-color: var(--md-sys-color-secondary-container);
        }

        .char-card img {
            max-height: 62%;
            max-width: 85%;
            object-fit: contain;
            border-radius: var(--md-shape-corner-small);
            margin-bottom: 4px;
            image-rendering: pixelated;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.12));
        }

        .char-card .label-large {
            font-size: clamp(0.82rem, 1.8vh, 0.95rem);
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 4px;
        }

        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            height: clamp(34px, 4.8vh, 44px);
        }

        .btn-text-icon {
            background: var(--md-sys-color-surface);
            border: 0.5px solid var(--md-sys-color-hairline);
            color: var(--md-sys-color-primary);
            font-weight: 700;
            font-size: clamp(0.88rem, 1.9vh, 1rem);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 5px 14px;
            border-radius: var(--md-shape-corner-full);
            box-shadow: var(--md-elevation-1);
            transition: all 0.2s ease;
        }

        .btn-text-icon:hover {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            box-shadow: var(--md-elevation-2);
            transform: translateY(-1px);
        }

        .chip-assist {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--md-sys-color-surface);
            border: 0.5px solid var(--md-sys-color-hairline);
            padding: 5px 14px;
            border-radius: var(--md-shape-corner-small);
            font-size: clamp(0.82rem, 1.8vh, 0.94rem);
            font-weight: 700;
            color: var(--md-sys-color-on-surface-variant);
            box-shadow: var(--md-elevation-1);
        }

        .pet-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1.1;
            min-height: 0;
            margin: 2px 0;
        }

        .pet-avatar-wrapper {
            height: clamp(85px, 22vh, 150px);
            width: clamp(85px, 22vh, 150px);
            border-radius: var(--md-shape-corner-large);
            background-color: var(--md-sys-color-surface);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 0.5px solid var(--md-sys-color-hairline);
            margin-bottom: 6px;
            box-shadow: var(--md-elevation-2);
            padding: 8px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .pet-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: var(--md-shape-corner-medium);
            image-rendering: pixelated;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.16));
        }

        .pet-avatar-wrapper.anim-pulse {
            transform: scale(1.08);
            border-color: var(--md-sys-color-primary);
            box-shadow: var(--md-elevation-3);
        }

        .pet-title {
            font-size: clamp(1.25rem, 2.7vh, 1.55rem);
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
        }

        .stats-section {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.3vh, 10px);
            flex-shrink: 0;
        }

        /* Cada estatística envolvida em um card com elevação suave */
        .stat-card {
            background-color: var(--md-sys-color-surface);
            border: 0.5px solid var(--md-sys-color-hairline);
            border-radius: var(--md-shape-corner-medium);
            padding: clamp(8px, 1.3vh, 11px) clamp(10px, 2vw, 14px);
            box-shadow: var(--md-elevation-1);
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: box-shadow 0.2s ease;
        }

        .stat-card:hover {
            box-shadow: var(--md-elevation-2);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(0.88rem, 1.9vh, 1rem);
            font-weight: 700;
            color: var(--md-sys-color-on-surface-variant);
        }

        .stat-header-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .linear-progress-track {
            height: 9px;
            width: 100%;
            background-color: var(--md-sys-color-surface-variant);
            border-radius: var(--md-shape-corner-full);
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
        }

        .linear-progress-indicator {
            height: 100%;
            width: 100%;
            background-color: var(--md-sys-color-primary);
            border-radius: var(--md-shape-corner-full);
            transition: width 0.35s cubic-bezier(0.4, 0.0, 0.2, 1), background-color 0.35s ease;
        }

        .actions-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(8px, 1.5vw, 12px);
            flex-shrink: 0;
        }

        .btn-m3-action {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            border: 0.5px solid var(--md-sys-color-hairline);
            padding: clamp(9px, 1.6vh, 13px) 6px;
            border-radius: var(--md-shape-corner-medium);
            font-weight: 700;
            font-size: clamp(0.88rem, 1.9vh, 1rem);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: var(--md-elevation-1);
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        .btn-m3-action:hover {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border-color: var(--md-sys-color-primary);
            transform: translateY(-2px);
            box-shadow: var(--md-elevation-2);
        }

        .btn-m3-action:active {
            transform: translateY(0) scale(0.98);
        }

        .snackbar {
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            padding: 8px 12px;
            border-radius: var(--md-shape-corner-small);
            font-size: clamp(0.82rem, 1.7vh, 0.92rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--md-elevation-1);
            border: 0.5px solid var(--md-sys-color-hairline);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-bar-title">
            <span class="material-symbols-outlined" style="font-size: 30px; color: var(--md-sys-color-primary);">pets</span>
            Guardiões
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Alternar Tema">
            <span class="material-symbols-outlined" id="themeIcon" style="font-size: 26px;">dark_mode</span>
        </button>
    </header>

    <main class="container">
        
        <!-- Tela 1: Seleção de Personagem -->
        <section id="screen-selection" class="screen active">
            <div>
                <h1 class="headline-medium">Escolha seu Guardião</h1>
                <p class="body-medium">Selecione um companheiro para acompanhar seu dia a dia.</p>
            </div>
            <div class="character-grid" id="charGrid">
                <!-- Injetado via JS -->
            </div>
        </section>

        <!-- Tela 2: O Jogo -->
        <section id="screen-game" class="screen">
            <div class="game-top-bar">
                <button class="btn-text-icon" id="btnChangePet">
                    <span class="material-symbols-outlined" style="font-size: 22px;">arrow_back</span>
                    Trocar
                </button>
                <div class="chip-assist" id="petAge">
                    <span class="material-symbols-outlined" style="font-size: 18px;">schedule</span>
                    Idade: 0 dias
                </div>
            </div>

            <div class="pet-display">
                <div class="pet-avatar-wrapper" id="petImgWrapper">
                    <img id="petImage" src="" alt="Guardião Virtual">
                </div>
                <h2 class="pet-title" id="petName">Nome</h2>
            </div>

            <div class="stats-section">
                <!-- Card Fome -->
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-header-label">
                            <span class="material-symbols-outlined" style="font-size: 20px; color: var(--md-sys-color-primary);">restaurant</span>
                            Fome
                        </span>
                        <span id="valFood">100%</span>
                    </div>
                    <div class="linear-progress-track">
                        <div class="linear-progress-indicator" id="barFood"></div>
                    </div>
                </div>

                <!-- Card Alegria -->
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-header-label">
                            <span class="material-symbols-outlined" style="font-size: 20px; color: var(--md-sys-color-primary);">sports_esports</span>
                            Alegria
                        </span>
                        <span id="valJoy">100%</span>
                    </div>
                    <div class="linear-progress-track">
                        <div class="linear-progress-indicator" id="barJoy"></div>
                    </div>
                </div>

                <!-- Card Energia -->
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-header-label">
                            <span class="material-symbols-outlined" style="font-size: 20px; color: var(--md-sys-color-primary);">bedtime</span>
                            Energia
                        </span>
                        <span id="valEnergy">100%</span>
                    </div>
                    <div class="linear-progress-track">
                        <div class="linear-progress-indicator" id="barEnergy"></div>
                    </div>
                </div>
            </div>

            <div class="actions-row">
                <button class="btn-m3-action" onclick="performAction('feed')">
                    <span class="material-symbols-outlined" style="font-size: 26px;">restaurant</span>
                    Alimentar
                </button>
                <button class="btn-m3-action" onclick="performAction('play')">
                    <span class="material-symbols-outlined" style="font-size: 26px;">sports_esports</span>
                    Brincar
                </button>
                <button class="btn-m3-action" onclick="performAction('sleep')">
                    <span class="material-symbols-outlined" style="font-size: 26px;">bedtime</span>
                    Dormir
                </button>
            </div>
            
            <div class="snackbar" id="messageBox">
                <span class="material-symbols-outlined" style="font-size: 22px;">info</span>
                <span id="messageText">Seu guardião está pronto!</span>
            </div>
        </section>

    </main>

    <script>
        const characters = [
            { id: 'leao', name: 'Rei Leão', src: 'x03-leao.png' },
            { id: 'tigre', name: 'Tigre Samurai', src: 'z03-tigre.png' },
            { id: 'raposa', name: 'Raposa Astuta', src: 'x04-raposa.png' },
            { id: 'dragao', name: 'Dragão Místico', src: 'z05-dragao.png' },
            { id: 'coelho', name: 'Princesa Coelha', src: 'z04-coelho.png' },
            { id: 'cabra', name: 'Cabra Bardo', src: 'z08-cabra.png' },
            { id: 'galo', name: 'Galo Espadachim', src: 'z10-galo.png' },
            { id: 'humana', name: 'Camponesa', src: 'h16-latina-f-young.png' },
            { id: 'monarca', name: 'Soberano Estelar', src: 'h20-nonbinary-mixed.png' },
            { id: 'macaco', name: 'Macaco Bobo', src: 'z09-macaco.png' }
        ];

        let gameState = {
            activePetId: null,
            stats: { food: 100, joy: 100, energy: 100 },
            lastUpdated: Date.now(),
            ageMinutes: 0
        };

        let gameLoopInterval = null;

        // Elementos DOM
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');
        const screenSelection = document.getElementById('screen-selection');
        const screenGame = document.getElementById('screen-game');
        const charGrid = document.getElementById('charGrid');
        const petImage = document.getElementById('petImage');
        const petImgWrapper = document.getElementById('petImgWrapper');
        const petName = document.getElementById('petName');
        const petAge = document.getElementById('petAge');
        const messageText = document.getElementById('messageText');
        
        const bars = {
            food: { fill: document.getElementById('barFood'), val: document.getElementById('valFood') },
            joy: { fill: document.getElementById('barJoy'), val: document.getElementById('valJoy') },
            energy: { fill: document.getElementById('barEnergy'), val: document.getElementById('valEnergy') }
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.dataset.theme = savedTheme;
            updateThemeIcon();
            updateThemeMeta();
        }

        themeBtn.addEventListener('click', () => {
            const isDark = document.body.dataset.theme === 'dark';
            document.body.dataset.theme = isDark ? 'light' : 'dark';
            localStorage.setItem('theme', document.body.dataset.theme);
            updateThemeIcon();
            updateThemeMeta();
        });

        function updateThemeIcon() {
            const isDark = document.body.dataset.theme === 'dark';
            themeIcon.innerText = isDark ? 'light_mode' : 'dark_mode';
        }

        function updateThemeMeta() {
            const isDark = document.body.dataset.theme === 'dark';
            const metaTag = document.getElementById('themeColorMeta');
            if (metaTag) {
                metaTag.setAttribute('content', isDark ? '#18120E' : '#FBF8F5');
            }
        }

        function renderSelection() {
            charGrid.innerHTML = '';
            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.onclick = () => selectPet(char.id);
                
                const img = document.createElement('img');
                img.src = char.src;
                img.alt = char.name;
                
                const name = document.createElement('span');
                name.className = 'label-large';
                name.innerText = char.name;
                
                card.appendChild(img);
                card.appendChild(name);
                charGrid.appendChild(card);
            });
        }

        function selectPet(id) {
            gameState.activePetId = id;
            gameState.stats = { food: 100, joy: 100, energy: 100 };
            gameState.lastUpdated = Date.now();
            gameState.ageMinutes = 0;
            saveGame();
            startGameUI();
        }

        function loadGame() {
            const saved = localStorage.getItem('guardioes_m3_save');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.activePetId) {
                        gameState = parsed;
                        calculateOfflineDrain();
                        startGameUI();
                        return;
                    }
                } catch (e) {
                    console.error("Erro ao carregar save.");
                }
            }
            screenSelection.classList.add('active');
            screenGame.classList.remove('active');
            renderSelection();
        }

        function saveGame() {
            gameState.lastUpdated = Date.now();
            localStorage.setItem('guardioes_m3_save', JSON.stringify(gameState));
        }

        function calculateOfflineDrain() {
            const now = Date.now();
            const diffMs = now - gameState.lastUpdated;
            const diffMinutes = Math.floor(diffMs / 60000);
            
            if (diffMinutes > 0) {
                const drain = diffMinutes * 2;
                gameState.stats.food = Math.max(0, gameState.stats.food - drain);
                gameState.stats.joy = Math.max(0, gameState.stats.joy - (drain * 0.8));
                gameState.stats.energy = Math.max(0, gameState.stats.energy - (drain * 0.5));
                gameState.ageMinutes += diffMinutes;
            }
        }

        function startGameUI() {
            screenSelection.classList.remove('active');
            screenGame.classList.add('active');
            
            const pet = characters.find(c => c.id === gameState.activePetId);
            if (pet) {
                petImage.src = pet.src;
                petName.innerText = pet.name;
            }

            updateUI();
            
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(gameTick, 10000);
        }

        function gameTick() {
            gameState.stats.food = Math.max(0, gameState.stats.food - 1);
            gameState.stats.joy = Math.max(0, gameState.stats.joy - 1);
            gameState.stats.energy = Math.max(0, gameState.stats.energy - 0.5);
            gameState.ageMinutes += 0.16;
            
            checkHealth();
            updateUI();
            saveGame();
        }

        function updateUI() {
            updateBar('food', gameState.stats.food);
            updateBar('joy', gameState.stats.joy);
            updateBar('energy', gameState.stats.energy);
            
            const dias = Math.floor(gameState.ageMinutes / 60);
            petAge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 18px;">schedule</span> Idade: ${dias} dias`;
        }

        function updateBar(statType, value) {
            const rounded = Math.floor(value);
            bars[statType].fill.style.width = `${rounded}%`;
            bars[statType].val.innerText = `${rounded}%`;
            
            if (value > 60) {
                bars[statType].fill.style.backgroundColor = 'var(--md-sys-color-primary)';
            } else if (value > 30) {
                bars[statType].fill.style.backgroundColor = 'var(--md-sys-color-warning)';
            } else {
                bars[statType].fill.style.backgroundColor = 'var(--md-sys-color-error)';
            }
        }

        function checkHealth() {
            if (gameState.stats.food === 0 || gameState.stats.joy === 0 || gameState.stats.energy === 0) {
                petImgWrapper.style.borderColor = 'var(--md-sys-color-error)';
                showMessage("Atenção! Seu Guardião precisa de cuidados urgentes!");
            } else {
                petImgWrapper.style.borderColor = 'var(--md-sys-color-hairline)';
            }
        }

        window.performAction = function(action) {
            animatePet();
            
            if (action === 'feed') {
                gameState.stats.food = Math.min(100, gameState.stats.food + 25);
                gameState.stats.energy = Math.max(0, gameState.stats.energy - 5);
                showMessage("HMM! Refeição reforçada para o guardião.");
            } else if (action === 'play') {
                gameState.stats.joy = Math.min(100, gameState.stats.joy + 25);
                gameState.stats.energy = Math.max(0, gameState.stats.energy - 10);
                gameState.stats.food = Math.max(0, gameState.stats.food - 5);
                showMessage("Diversão garantida! Alegria aumentou.");
            } else if (action === 'sleep') {
                gameState.stats.energy = Math.min(100, gameState.stats.energy + 40);
                gameState.stats.food = Math.max(0, gameState.stats.food - 10);
                showMessage("Zzz... hora de descansar e recarregar.");
            }
            
            updateUI();
            saveGame();
        };

        function animatePet() {
            petImgWrapper.classList.remove('anim-pulse');
            void petImgWrapper.offsetWidth; 
            petImgWrapper.classList.add('anim-pulse');
            setTimeout(() => {
                petImgWrapper.classList.remove('anim-pulse');
            }, 280);
        }

        function showMessage(msg) {
            messageText.innerText = msg;
        }

        document.getElementById('btnChangePet').addEventListener('click', () => {
            gameState.activePetId = null;
            saveGame();
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            renderSelection();
            screenGame.classList.remove('active');
            screenSelection.classList.add('active');
        });

        // Inicialização
        initTheme();
        loadGame();
    </script>
</body>
</html>
